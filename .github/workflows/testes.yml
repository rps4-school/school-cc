name: Testes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Testes de JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Corretor e progresso
        run: node --test .mkdocs/corretor.test.js .mkdocs/progresso.test.js

      # Protoboard, redes, solucionador, diagnósticos e os circuitos publicados do laboratório.
      - name: Laboratório
        run: node --test ".mkdocs/laboratorio/testes/*.test.js"

  laboratorio:
    name: Laboratório com firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/arduino
          key: arduino-cli-1.5.1-avr-1.8.8-servo-1.3.0-${{ runner.os }}

      - name: Compilar os sketches
        run: |
          source .mkdocs/laboratorio/instalar-arduino-cli.sh "$RUNNER_TEMP/arduino"
          python .mkdocs/laboratorio/compilar.py --arduino-cli "$ARDUINO_CLI" --saida "$RUNNER_TEMP/firmware"

      # Os 9 casos do Blink e o emulador, no ATmega328P emulado. Sem o firmware, esses testes falham.
      - name: Testes do laboratório com o firmware
        run: node --test ".mkdocs/laboratorio/testes/*.test.js"
        env:
          FIRMWARE_DIR: ${{ runner.temp }}/firmware
          EXIGIR_FIRMWARE: "1"

  python:
    name: Testes de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .mkdocs/requirements.txt

      - run: pip install -r .mkdocs/requirements.txt

      - name: Catálogo, componentes e hooks
        run: python -m unittest discover -s .mkdocs -p "test_*.py" -v
