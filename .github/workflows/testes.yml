name: Testes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Testes de JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Corretor e progresso
        run: node --test .mkdocs/corretor.test.js .mkdocs/progresso.test.js

  python:
    name: Testes de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .mkdocs/requirements.txt

      - run: pip install -r .mkdocs/requirements.txt

      - name: Catálogo, componentes e hooks
        run: python -m unittest discover -s .mkdocs -p "test_*.py" -v
