name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O site.css é gerado pelo Tailwind e fica no repositório (quem só escreve
      # Markdown não precisa de Node). Aqui conferimos se ele está atualizado.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .mkdocs/package-lock.json

      - name: CSS atualizado?
        run: |
          npm ci --prefix .mkdocs
          npm run css --prefix .mkdocs
          git diff --exit-code .mkdocs/site.css || {
            echo "::error::O .mkdocs/site.css está desatualizado. Rode 'npm run css --prefix .mkdocs' e faça commit."
            exit 1
          }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .mkdocs/requirements.txt

      - run: pip install -r .mkdocs/requirements.txt

      # --strict falha o build (e o PR) se houver link ou âncora quebrados.
      - name: Build
        run: mkdocs build --strict -f .mkdocs/mkdocs.yml
        env:
          SITE_DIR: ${{ runner.temp }}/site
          NO_MKDOCS_2_WARNING: "1"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
