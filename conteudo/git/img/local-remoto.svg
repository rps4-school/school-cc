<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Repositório local e repositório remoto</title>
  <desc id="desc">git push envia commits do computador para o GitHub. git pull baixa e junta na sua branch. git fetch só baixa. git clone copia o repositório inteiro na primeira vez.</desc>
  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .t { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #111827; }
      .h { font-size: 18px; font-weight: 700; }
      .s { font-size: 13px; fill: #6b7280; }
      .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .linha { stroke: #374151; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="400" rx="16" fill="#ffffff"/>
  <text class="t" x="500" y="44" text-anchor="middle" font-size="22" font-weight="700">Local × remoto</text>

  <!-- Notebook -->
  <rect x="80" y="100" width="250" height="160" rx="10" fill="#1F2937"/>
  <rect x="92" y="112" width="226" height="136" rx="4" fill="#F9FAFB"/>
  <path d="M50 262 H360 L338 288 H72 Z" fill="#9CA3AF"/>
  <rect x="180" y="262" width="50" height="6" rx="3" fill="#6B7280"/>
  <text class="t h" x="205" y="142" text-anchor="middle">Seu computador</text>
  <text class="t s" x="205" y="162" text-anchor="middle">repositório local</text>
  <path d="M140 205 H270" stroke="#3B82F6" stroke-width="4"/>
  <circle cx="140" cy="205" r="11" fill="#ffffff" stroke="#3B82F6" stroke-width="4"/>
  <circle cx="183" cy="205" r="11" fill="#ffffff" stroke="#3B82F6" stroke-width="4"/>
  <circle cx="226" cy="205" r="11" fill="#ffffff" stroke="#3B82F6" stroke-width="4"/>
  <circle cx="270" cy="205" r="11" fill="#3B82F6"/>
  <text class="t s" x="270" y="234" text-anchor="middle">novo</text>

  <!-- Nuvem -->
  <g fill="#EDE9FE">
    <circle cx="715" cy="225" r="48"/>
    <circle cx="790" cy="178" r="64"/>
    <circle cx="870" cy="200" r="54"/>
    <circle cx="915" cy="245" r="34"/>
    <rect x="690" y="225" width="250" height="54" rx="27"/>
  </g>
  <text class="t h" x="812" y="176" text-anchor="middle">GitHub</text>
  <text class="t s" x="812" y="196" text-anchor="middle">repositório remoto (origin)</text>
  <path d="M750 240 H850" stroke="#8B5CF6" stroke-width="4"/>
  <circle cx="750" cy="240" r="11" fill="#ffffff" stroke="#8B5CF6" stroke-width="4"/>
  <circle cx="800" cy="240" r="11" fill="#ffffff" stroke="#8B5CF6" stroke-width="4"/>
  <circle cx="850" cy="240" r="11" fill="#ffffff" stroke="#8B5CF6" stroke-width="4"/>

  <!-- Setas -->
  <path class="linha" d="M380 110 H650" marker-end="url(#seta2)"/>
  <rect x="465" y="96" width="100" height="28" rx="14" fill="#3B82F6"/>
  <text class="m" x="515" y="115" text-anchor="middle">git push</text>
  <text class="t s" x="515" y="143" text-anchor="middle">envia os seus commits</text>

  <path class="linha" d="M650 185 H380" marker-end="url(#seta2)"/>
  <rect x="465" y="171" width="100" height="28" rx="14" fill="#8B5CF6"/>
  <text class="m" x="515" y="190" text-anchor="middle">git pull</text>
  <text class="t s" x="515" y="218" text-anchor="middle">baixa e junta na sua branch</text>

  <path class="linha" d="M650 260 H380" stroke-dasharray="7 5" marker-end="url(#seta2)"/>
  <rect x="460" y="246" width="110" height="28" rx="14" fill="#6B7280"/>
  <text class="m" x="515" y="265" text-anchor="middle">git fetch</text>
  <text class="t s" x="515" y="293" text-anchor="middle">só baixa, não mexe nos seus arquivos</text>

  <path class="linha" d="M650 335 H380" marker-end="url(#seta2)"/>
  <rect x="460" y="321" width="110" height="28" rx="14" fill="#111827"/>
  <text class="m" x="515" y="340" text-anchor="middle">git clone</text>
  <text class="t s" x="515" y="368" text-anchor="middle">primeira vez: copia o repositório inteiro</text>
</svg>
