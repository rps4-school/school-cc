<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="titulo desc">
  <title id="titulo">O parâmetro é outra etiqueta para o mesmo objeto</title>
  <desc id="desc">No programa, a etiqueta notas aponta para a lista [8, 7]. Na chamada adicionar(notas, 10), o parâmetro lista, dentro da função, passa a apontar para a mesma lista. Por isso lista.append(10) muda a lista que o programa vê: depois da chamada, notas vale [8, 7, 10].</desc>
  <style>
    .h { font-family: Inter, system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #1e1b4b; }
    .c { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; fill: #111827; }
    .e { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #6d28d9; }
    .l { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: #4b5563; }
    .n { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #047857; }
  </style>
  <defs>
    <marker id="seta4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <rect x="30" y="30" width="250" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="58" class="h">Programa</text>
  <text x="48" y="90" class="c">notas = [8, 7]</text>
  <text x="48" y="120" class="c">adicionar(notas, 10)</text>
  <rect x="48" y="160" width="90" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="93" y="186" text-anchor="middle" class="e">notas</text>

  <rect x="600" y="30" width="280" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="616" y="58" class="h">Dentro de adicionar</text>
  <text x="616" y="90" class="c" font-size="16">def adicionar(lista, n):</text>
  <text x="654" y="120" class="c" font-size="16">lista.append(n)</text>
  <rect x="762" y="160" width="90" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="807" y="186" text-anchor="middle" class="e">lista</text>

  <rect x="340" y="150" width="220" height="58" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="450" y="186" text-anchor="middle" class="c">[8, 7, <tspan class="n">10</tspan>]</text>
  <line x1="138" y1="179" x2="334" y2="179" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#seta4)"/>
  <line x1="762" y1="179" x2="566" y2="179" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#seta4)"/>
  <text x="450" y="138" text-anchor="middle" class="l">a mesma lista</text>

  <text x="30" y="270" class="l">O parâmetro recebe outra etiqueta para o mesmo objeto (chamada por compartilhamento).</text>
  <text x="30" y="294" class="l">Por isso append dentro da função muda a lista de quem chamou: notas agora vale [8, 7, 10].</text>
  <text x="30" y="318" class="l">Já lista = [0] dentro da função só move a etiqueta de dentro: notas não muda.</text>
</svg>
