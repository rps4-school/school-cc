<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Variáveis são etiquetas</title>
  <desc id="desc">Depois de b = a, as etiquetas a e b estão coladas no mesmo dicionário: mudar por b aparece em a. Já c = dict(a) cria um dicionário novo, com a mesma informação; mudar c não afeta a.</desc>
  <style>
    .h { font-family: Inter, system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #1e1b4b; }
    .c { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; fill: #111827; }
    .e { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 20px; font-weight: 700; fill: #6d28d9; }
    .l { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: #4b5563; }
    .ok { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #b91c1c; }
    .ok2 { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #047857; }
  </style>
  <defs>
    <marker id="seta3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6d28d9"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>

  <text x="40" y="38" class="h">b = a   (a mesma coisa, com dois nomes)</text>
  <rect x="40" y="70" width="60" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="70" y="96" text-anchor="middle" class="e">a</text>
  <rect x="40" y="150" width="60" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="70" y="176" text-anchor="middle" class="e">b</text>
  <path d="M100 89 C140 89 150 120 176 122" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#seta3)"/>
  <path d="M100 169 C140 169 150 140 176 138" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#seta3)"/>
  <rect x="182" y="100" width="210" height="60" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="287" y="137" text-anchor="middle" class="c">{"Ana": 8}</text>
  <text x="40" y="230" class="c">b["Bia"] = 6</text>
  <text x="40" y="258" class="ok">print(a) → {"Ana": 8, "Bia": 6}</text>
  <text x="40" y="282" class="l">a também mudou: é o mesmo dicionário.</text>

  <line x1="440" y1="24" x2="440" y2="286" stroke="#e5e7eb" stroke-width="2"/>

  <text x="480" y="38" class="h">c = dict(a)   (uma cópia nova)</text>
  <rect x="480" y="70" width="60" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="510" y="96" text-anchor="middle" class="e">a</text>
  <rect x="480" y="150" width="60" height="38" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="510" y="176" text-anchor="middle" class="e">c</text>
  <line x1="540" y1="89" x2="606" y2="89" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#seta3)"/>
  <line x1="540" y1="169" x2="606" y2="169" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#seta3)"/>
  <rect x="612" y="66" width="210" height="46" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="717" y="96" text-anchor="middle" class="c">{"Ana": 8}</text>
  <rect x="612" y="146" width="210" height="46" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="717" y="176" text-anchor="middle" class="c">{"Ana": 8}</text>
  <text x="480" y="230" class="c">c["Bia"] = 6</text>
  <text x="480" y="258" class="ok2">print(a) → {"Ana": 8}</text>
  <text x="480" y="282" class="l">a não muda: c é outro dicionário.</text>
</svg>
