<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Dicionário dentro de dicionário</title>
  <desc id="desc">A variável turma é um dicionário com as chaves "Ana" e "Bia". Cada valor é outro dicionário, com as chaves "idade" e "notas"; o valor de "notas" é uma lista. O caminho turma["Ana"]["notas"][1] vai do dicionário de fora para o de dentro e, depois, para a posição 1 da lista, que vale 7.5.</desc>
  <style>
    .h { font-family: Inter, system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #1e1b4b; }
    .c { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; fill: #111827; }
    .k { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #92400e; }
    .p { font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; }
    .l { font-family: Inter, system-ui, sans-serif; font-size: 15px; fill: #4b5563; }
    .d { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #6d28d9; }
  </style>
  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#ffffff"/>

  <rect x="30" y="140" width="110" height="50" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="85" y="171" text-anchor="middle" class="d">turma</text>

  <rect x="200" y="70" width="90" height="40" rx="20" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="245" y="96" text-anchor="middle" class="k">"Ana"</text>
  <rect x="200" y="230" width="90" height="40" rx="20" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="245" y="256" text-anchor="middle" class="k">"Bia"</text>
  <path d="M140 160 C170 160 170 90 196 90" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#seta2)"/>
  <path d="M140 170 C170 170 170 250 196 250" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#seta2)"/>

  <rect x="340" y="40" width="250" height="100" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="356" y="54" width="96" height="30" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="404" y="75" text-anchor="middle" class="k">"idade"</text>
  <text x="470" y="75" class="c">→ 19</text>
  <rect x="356" y="96" width="96" height="30" rx="15" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <text x="404" y="117" text-anchor="middle" class="k">"notas"</text>
  <path d="M290 90 L334 90" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#seta2)"/>

  <rect x="340" y="200" width="250" height="100" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="356" y="214" width="96" height="30" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="404" y="235" text-anchor="middle" class="k">"idade"</text>
  <text x="470" y="235" class="c">→ 20</text>
  <rect x="356" y="256" width="96" height="30" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="404" y="277" text-anchor="middle" class="k">"notas"</text>
  <text x="470" y="277" class="c">→ [6, 9]</text>
  <path d="M290 250 L334 250" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#seta2)"/>

  <path d="M452 111 C520 111 560 160 626 160" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#seta2)"/>
  <rect x="632" y="138" width="70" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="667" y="166" text-anchor="middle" class="c">8</text>
  <rect x="702" y="138" width="70" height="44" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="737" y="166" text-anchor="middle" class="c">7.5</text>
  <rect x="772" y="138" width="70" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="807" y="166" text-anchor="middle" class="c">9</text>
  <text x="667" y="200" text-anchor="middle" class="p">0</text>
  <text x="737" y="200" text-anchor="middle" class="p">1</text>
  <text x="807" y="200" text-anchor="middle" class="p">2</text>

  <text x="30" y="332" class="c">turma["Ana"]["notas"][1]  →  7.5</text>
  <text x="440" y="332" class="l">Leia da esquerda para a direita: cada [ ] entra um nível.</text>
</svg>
