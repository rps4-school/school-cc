<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 420' width='760' height='420' role='img' aria-label='PWM com três ciclos de trabalho: com analogWrite 64 o pino fica 25 % do tempo em 5 V e a média é 1,25 V; com 128, 50 % e 2,5 V; com 191, 75 % e 3,75 V; o período é o mesmo, perto de 2 ms'>
<title>PWM com três ciclos de trabalho: com analogWrite 64 o pino fica 25 % do tempo em 5 V e a média é 1,25 V; com 128, 50 % e 2,5 V; com 191, 75 % e 3,75 V; o período é o mesmo, perto de 2 ms</title>
