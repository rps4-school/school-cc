<g transform='translate(280,96)'><polygon points='-12,-11 -12,11 12,0' fill='#fee2e2' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/><line x1='12' y1='-11' x2='12' y2='11' stroke='#1e293b' stroke-width='2.5'/><line x1='-2' y1='-14' x2='6' y2='-24' stroke='#b45309' stroke-width='1.6'/><polygon points='7.5,-26 2.6,-23.6 6.2,-20.6' fill='#b45309'/><line x1='5' y1='-12' x2='13' y2='-22' stroke='#b45309' stroke-width='1.6'/><polygon points='14.5,-24 9.6,-21.6 13.2,-18.6' fill='#b45309'/></g>
<text x='250' y='126' font-size='12' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>ânodo</text>
<text x='310' y='126' font-size='12' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>cátodo</text>
<polyline points='310,96 360,96 360,116' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='360,116 360,126' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='346,126 374,126' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='351,131 369,131' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='356,136 364,136' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
