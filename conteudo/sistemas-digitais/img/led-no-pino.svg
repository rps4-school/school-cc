<text x='320' y='218' font-size='14' fill='#4f46e5' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>Corrente: (5 − 2) / 220 ≈ 13,6 mA, abaixo dos 20 mA do pino.</text>
