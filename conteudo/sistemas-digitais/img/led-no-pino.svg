<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 250' width='640' height='250' role='img' aria-label='LED ligado a um pino do Arduino: pino 8, resistor de 220 ohms, LED e GND; com o pino em HIGH o LED acende e em LOW apaga'>
<title>LED ligado a um pino do Arduino: pino 8, resistor de 220 ohms, LED e GND; com o pino em HIGH o LED acende e em LOW apaga</title>
<rect width='640' height='250' rx='12' fill='#ffffff'/>
<circle cx='70' cy='96' r='3.5' fill='#ffffff' stroke='#1e293b' stroke-width='2'/>
<text x='62' y='101' font-size='14' fill='#4f46e5' text-anchor='end' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>pino 8</text>
<polyline points='74,96 130,96' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='130,96 146,96' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='194,96 210,96' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<g transform='translate(170,96)'><polyline points='-24,0 -20,-7 -12,7 -4,-7 4,7 12,-7 20,7 24,0' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/></g>
