<rect x='420' y='54' width='196' height='44' rx='8' fill='#dcfce7' stroke='#059669' stroke-width='2'/>
<text x='518' y='72' font-size='13' fill='#059669' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>HIGH: 5 V no pino</text>
<text x='518' y='89' font-size='12' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>o LED acende</text>
<rect x='420' y='112' width='196' height='44' rx='8' fill='#f1f5f9' stroke='#475569' stroke-width='2'/>
<text x='518' y='130' font-size='13' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>LOW: 0 V no pino</text>
