<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 250' width='600' height='250' role='img' aria-label='Esquema de uma fonte de 5 volts com resistor e LED em série: o LED fica com cerca de 2 volts e o resistor com o resto, 3 volts'>
<title>Esquema de uma fonte de 5 volts com resistor e LED em série: o LED fica com cerca de 2 volts e o resistor com o resto, 3 volts</title>
<rect width='600' height='250' rx='12' fill='#ffffff'/>
<polyline points='80,116 80,127' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='80,139 80,150' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<g transform='translate(80,133) rotate(90)'><line x1='-6' y1='-17' x2='-6' y2='17' stroke='#1e293b' stroke-width='2'/><line x1='6' y1='-9' x2='6' y2='9' stroke='#1e293b' stroke-width='4.5'/></g>
<polyline points='80,116 80,70 186,70' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='186,70 196,70' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
