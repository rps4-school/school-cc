<text x='375' y='80' font-size='13' fill='#1e293b' text-anchor='start' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>Um fio liga o + ao − direto.</text>
<text x='375' y='101' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>• A corrente passa quase toda pelo</text>
<text x='375' y='122' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>  fio, o caminho sem resistência.</text>
<text x='375' y='143' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>• A lâmpada apaga.</text>
<text x='375' y='164' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>• A corrente fica enorme: bateria,</text>
<text x='375' y='185' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>  fios e Arduino esquentam e podem</text>
<text x='375' y='206' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>  queimar.</text>
