<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 250' width='600' height='250' role='img' aria-label='Resistor com faixas vermelho, vermelho, marrom e dourado: 2, 2, vezes 10, mais ou menos 5 por cento; 22 vezes 10 é igual a 220 ohms'>
<title>Resistor com faixas vermelho, vermelho, marrom e dourado: 2, 2, vezes 10, mais ou menos 5 por cento; 22 vezes 10 é igual a 220 ohms</title>
<rect width='600' height='250' rx='12' fill='#ffffff'/>
<polyline points='40,92 560,92' fill='none' stroke='#94a3b8' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'/>
<rect x='118' y='58' width='374' height='68' rx='30' fill='#fde68a' stroke='#a16207' stroke-width='2'/>
<rect x='160' y='58' width='20' height='68' fill='#dc2626'/>
<polyline points='170,132 170,148' fill='none' stroke='#475569' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='170' y='168' font-size='16' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>2</text>
<text x='170' y='186' font-size='11' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>1º algarismo</text>
<rect x='240' y='58' width='20' height='68' fill='#dc2626'/>
<polyline points='250,132 250,148' fill='none' stroke='#475569' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='250' y='168' font-size='16' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>2</text>
<text x='250' y='186' font-size='11' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>2º algarismo</text>
<rect x='320' y='58' width='20' height='68' fill='#7c2d12'/>
<polyline points='330,132 330,148' fill='none' stroke='#475569' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='330' y='168' font-size='16' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>× 10</text>
<text x='330' y='186' font-size='11' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>multiplicador</text>
<rect x='430' y='58' width='20' height='68' fill='#ca8a04'/>
<polyline points='440,132 440,148' fill='none' stroke='#475569' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='440' y='168' font-size='16' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>± 5 %</text>
<text x='440' y='186' font-size='11' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>tolerância</text>
<text x='300' y='40' font-size='13' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>Leia da esquerda para a direita: a faixa dourada (mais afastada) fica no fim</text>
<text x='300' y='234' font-size='15' fill='#4f46e5' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>22 × 10 = 220 Ω, com tolerância de ± 5 % (de 209 Ω a 231 Ω)</text>
</svg>
