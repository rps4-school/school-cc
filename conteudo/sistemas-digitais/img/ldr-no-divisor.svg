<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 330' width='640' height='330' role='img' aria-label='LDR num divisor de tensão: o LDR vai do 5 V ao pino A0 e um resistor de 10 kΩ vai do A0 ao GND; com mais luz a resistência do LDR cai e a tensão no A0 sobe'>
<title>LDR num divisor de tensão: o LDR vai do 5 V ao pino A0 e um resistor de 10 kΩ vai do A0 ao GND; com mais luz a resistência do LDR cai e a tensão no A0 sobe</title>
<rect width='640' height='330' rx='12' fill='#ffffff'/>
<polyline points='150,40 150,54' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='136,40 164,40' fill='none' stroke='#1e293b' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/>
<text x='150' y='32' font-size='13' fill='#dc2626' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>5 V</text>
<polyline points='150,54 150,73' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='150,121 150,140' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<g transform='translate(150,97) rotate(90)'><polyline points='-24,0 -20,-7 -12,7 -4,-7 4,7 12,-7 20,7 24,0' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/></g>
<text x='132' y='102' font-size='14' fill='#1e293b' text-anchor='end' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>LDR</text>
<polyline points='208,68 174,86' fill='none' stroke='#b45309' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'/>
<polygon points='165.82,90.29 174.69,81.3 178.23,87.96' fill='#b45309'/>
<polyline points='208,86 174,104' fill='none' stroke='#b45309' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'/>
<polygon points='165.82,108.29 174.69,99.3 178.23,105.96' fill='#b45309'/>
<text x='214' y='74' font-size='12' fill='#b45309' text-anchor='start' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>luz</text>
<polyline points='150,140 150,170' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<circle cx='150' cy='170' r='3.5' fill='#1e293b'/>
<polyline points='150,170 190,170' fill='none' stroke='#4f46e5' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polygon points='202,170 188.23,174.31 188.23,165.69' fill='#4f46e5'/>
<text x='204' y='175' font-size='13' fill='#4f46e5' text-anchor='start' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>A0</text>
<polyline points='150,170 150,189' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='150,237 150,256' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<g transform='translate(150,213) rotate(90)'><polyline points='-24,0 -20,-7 -12,7 -4,-7 4,7 12,-7 20,7 24,0' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round'/></g>
<text x='132' y='218' font-size='13' fill='#475569' text-anchor='end' font-family='Inter, Segoe UI, Arial, sans-serif'>10 kΩ</text>
<polyline points='150,256 150,266' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='136,266 164,266' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='141,271 159,271' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<polyline points='146,276 154,276' fill='none' stroke='#1e293b' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>
<rect x='330' y='70' width='280' height='190' rx='10' fill='#f8fafc' stroke='#475569' stroke-width='1.2'/>
<text x='346' y='100' font-size='13' fill='#4f46e5' text-anchor='start' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>V(A0) = 5 · 10k / (10k + R(LDR))</text>
<text x='346' y='122' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'></text>
<text x='346' y='144' font-size='13' fill='#1e293b' text-anchor='start' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>Escuro: R(LDR) ≈ 1 MΩ</text>
<text x='346' y='166' font-size='13' fill='#475569' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>V(A0) ≈ 0,05 V → leitura ≈ 10</text>
<text x='346' y='188' font-size='13' fill='#1e293b' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'></text>
<text x='346' y='210' font-size='13' fill='#1e293b' text-anchor='start' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>Luz forte: R(LDR) ≈ 1 kΩ</text>
<text x='346' y='232' font-size='13' fill='#475569' text-anchor='start' font-family='Inter, Segoe UI, Arial, sans-serif'>V(A0) ≈ 4,5 V → leitura ≈ 930</text>
<text x='320' y='304' font-size='14' fill='#4f46e5' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>Mais luz → R(LDR) menor → tensão no A0 maior → leitura maior.</text>
</svg>
