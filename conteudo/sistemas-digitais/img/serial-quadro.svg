<text x='34' y='134' font-size='12' fill='#475569' text-anchor='end' font-family='Inter, Segoe UI, Arial, sans-serif'>0</text>
<text x='330' y='26' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>A letra 'A' = 65 = 0x41 = 0100 0001 no fio da serial</text>
<text x='330' y='198' font-size='13' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>Os 8 bits saem do menos significativo (b0) para o mais significativo (b7).</text>
<text x='330' y='220' font-size='13' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>A 9600 baud, cada bit dura cerca de 104 µs: 10 bits por letra, ~960 letras por segundo.</text>
