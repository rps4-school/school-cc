<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 660 250' width='660' height='250' role='img' aria-label='Como a letra A, código 65, sai pelo fio da serial: um bit de início em 0, os 8 bits do menos para o mais significativo, 1 0 0 0 0 0 1 0, e um bit de fim em 1'>
<title>Como a letra A, código 65, sai pelo fio da serial: um bit de início em 0, os 8 bits do menos para o mais significativo, 1 0 0 0 0 0 1 0, e um bit de fim em 1</title>
