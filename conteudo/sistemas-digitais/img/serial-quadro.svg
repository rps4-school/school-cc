<text x='315' y='158' font-size='12' fill='#475569' text-anchor='middle' font-family='Inter, Segoe UI, Arial, sans-serif'>b4</text>
<rect x='340' y='60' width='50' height='80' fill='#eef2ff' stroke='#e2e8f0'/>
<text x='365' y='52' font-size='15' fill='#1e293b' text-anchor='middle' font-weight='bold' font-family='Inter, Segoe UI, Arial, sans-serif'>0</text>
